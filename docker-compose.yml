version: "3.9"

# HydroMAS deployment stack
#
# 架构:
#   - hydromas: HydroMAS 认知智能内核 (FastAPI)
#   - tdengine: 时序数据库 (传感器数据)
#   - neo4j: 图数据库 (水网拓扑/知识图谱)
#
# 快速启动:
#   docker-compose up -d

services:
  # ─── HydroMAS 认知智能内核 ───
  hydromas:
    build: .
    container_name: hydromas-core
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - ALLOWED_ORIGINS=http://localhost:8000,http://47.252.80.72:8000
      - TDENGINE_HOST=tdengine
      - TDENGINE_PORT=6041
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=hydromas2024
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN:-}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY:-}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - FEISHU_ALERT_WEBHOOK_URL=${FEISHU_ALERT_WEBHOOK_URL:-}
      - FEISHU_BITABLE_APP_TOKEN=${FEISHU_BITABLE_APP_TOKEN:-}
      - HYDROMAS_API_KEY=${HYDROMAS_API_KEY:-}
      - HYDROMAS_SESSION_SCOPE=per-user
    depends_on:
      - tdengine
      - neo4j
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - hydromas_sessions:/app/data/sessions
      - hydromas_memory:/app/data/memory
      - hydromas_interactions:/app/data/interactions
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/gateway/health')"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ─── 时序数据库 ───
  tdengine:
    image: tdengine/tdengine:3.2.3.0
    container_name: hydromas-tdengine
    ports:
      - "6030:6030"
      - "6041:6041"
    volumes:
      - tdengine_data:/var/lib/taos
    restart: unless-stopped

  # ─── 图数据库 ───
  neo4j:
    image: neo4j:5.15-community
    container_name: hydromas-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/hydromas2024
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

volumes:
  tdengine_data:
  neo4j_data:
  hydromas_sessions:
  hydromas_memory:
  hydromas_interactions:
