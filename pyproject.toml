[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromas"
version = "0.3.0"
description = "HydroMAS: Water Network Intelligent Workbench — Multi-Agent Cognitive Decision Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HydroOS Team"},
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "pydantic>=2.0",
    "matplotlib>=3.7",
    "control>=0.9",
    "pulp>=2.7",
    "ray>=2.9",
    "mcp>=1.0",
    "langgraph>=0.2",
    "langchain-anthropic>=0.1",
    "pyyaml>=6.0",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "httpx>=0.25",
]
lstm = [
    "torch>=2.0",
]
web = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
]
alumina = [
    "wntr>=1.0",
    "networkx>=3.0",
]
gnn = [
    "torch>=2.0",
    "torch_geometric>=2.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["core*", "compute*", "mcp_servers*", "skills*", "agents*", "web*", "knowledge*", "integrations*", "openclaw*", "hydroclaw*", "hydromas*"]
